name: Deploy Web App (GitHub Pages)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy_web:
    name: Build & Deploy Wasm Web App
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Web Target (Wasm)
        run: ./gradlew :wasmApp:wasmJsBrowserDistribution --stacktrace

      - name: Prepare Web Distribution & SPA Fallback
        run: |
          DIST_DIR="wasmApp/build/dist/wasmJs/productionExecutable"
          if [ -d "$DIST_DIR" ]; then
            # Copy index.html to 404.html so GitHub Pages routes all paths to Wasm app
            cp "$DIST_DIR/index.html" "$DIST_DIR/404.html"
            echo "Prepared distribution in $DIST_DIR with 404.html fallback"
          else
            echo "ERROR: Distribution directory $DIST_DIR not found"
            exit 1
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'wasmApp/build/dist/wasmJs/productionExecutable'

      - name: Deploy to GitHub Pages (Actions)
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy to gh-pages Branch (Branch-based fallback)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./wasmApp/build/dist/wasmJs/productionExecutable
          publish_branch: gh-pages

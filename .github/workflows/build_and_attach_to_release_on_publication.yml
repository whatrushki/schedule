name: Build, Release and Publish All Targets

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.3.1)'
        required: false
        default: '1.3.1'

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError"
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  RELEASE_SIGN_KEY_ALIAS: ${{ secrets.RELEASE_SIGN_KEY_ALIAS }}
  RELEASE_SIGN_KEY_PASSWORD: ${{ secrets.RELEASE_SIGN_KEY_PASSWORD }}

jobs:
  build_release_publish:
    name: Build Android, Linux & Web, Publish Packages & Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Checkout keystore repo
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.KEYSTORE_GIT_REPOSITORY }}
          token: ${{ secrets.KEYSTORE_ACCESS_TOKEN }}
          path: app/keystore

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Determine Version
        id: get_version
        run: |
          VERSION="${{ github.event.release.tag_name || github.event.inputs.version || '1.3.1' }}"
          CLEAN_VERSION="${VERSION#v}"
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Run Tests
        run: |
          ./gradlew :libs:schedule:core:jvmTest \
                    :libs:schedule:rksi:jvmTest \
                    :libs:schedule:dgtu:jvmTest \
                    :libs:schedule:iubip:jvmTest \
                    :libs:schedule:rinh:jvmTest \
                    :libs:schedule:sfedu:jvmTest \
                    --stacktrace

      - name: Publish API Libraries to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ./gradlew publish -Pversion=${{ steps.get_version.outputs.version }} --no-daemon

      - name: Build Android Targets (APK & AAB)
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          mkdir -p release_assets
          # Collect APKs (signed or unsigned)
          find app/build/outputs/apk -name "*.apk" -exec cp {} release_assets/schedule_android_${{ steps.get_version.outputs.version }}.apk \; || true
          find app/build/outputs/bundle -name "*.aab" -exec cp {} release_assets/schedule_android_${{ steps.get_version.outputs.version }}.aab \; || true

      - name: Build Linux Desktop Targets (DEB, RPM & JAR)
        run: |
          sudo apt-get update && sudo apt-get install -y rpm || true
          ./gradlew :desktopApp:packageReleaseDeb :desktopApp:packageReleaseRpm :desktopApp:packageUberJarForCurrentOS || ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS || true
          mkdir -p release_assets
          find desktopApp/build -name "*.deb" -exec cp {} release_assets/schedule_linux_${{ steps.get_version.outputs.version }}.deb \; || true
          find desktopApp/build -name "*.rpm" -exec cp {} release_assets/schedule_linux_${{ steps.get_version.outputs.version }}.rpm \; || true
          find desktopApp/build -name "*.jar" -exec cp {} release_assets/schedule_desktop_${{ steps.get_version.outputs.version }}.jar \; || true

      - name: Build Web Target (Wasm)
        run: |
          ./gradlew :wasmApp:wasmJsBrowserDistribution || true
          DIST_DIR="wasmApp/build/dist/wasmJs/productionExecutable"
          if [ -d "$DIST_DIR" ]; then
            cp "$DIST_DIR/index.html" "$DIST_DIR/404.html"
            cd "$DIST_DIR"
            zip -r ../../../../../release_assets/schedule_web_${{ steps.get_version.outputs.version }}.zip .
            cd -
          fi

      - name: Upload Artifacts to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup GitHub Pages
        if: success()
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: success() && hashFiles('wasmApp/build/dist/wasmJs/productionExecutable/**') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'wasmApp/build/dist/wasmJs/productionExecutable'

      - name: Deploy to GitHub Pages (Actions)
        if: success() && hashFiles('wasmApp/build/dist/wasmJs/productionExecutable/**') != ''
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy to gh-pages Branch (Fallback)
        if: success() && hashFiles('wasmApp/build/dist/wasmJs/productionExecutable/**') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./wasmApp/build/dist/wasmJs/productionExecutable
          publish_branch: gh-pages

  build_windows:
    name: Build Windows Desktop Target (MSI & EXE)
    runs-on: windows-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name || github.event.inputs.version || '1.3.2' }}"
          $cleanVersion = $version.TrimStart('v')
          echo "version=$cleanVersion" >> $env:GITHUB_OUTPUT
          echo "tag=$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows Desktop Installers (MSI & EXE)
        shell: pwsh
        run: |
          ./gradlew :desktopApp:packageReleaseMsi :desktopApp:packageReleaseExe
          if ($LASTEXITCODE -ne 0) {
            ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS
          }
          New-Item -ItemType Directory -Force -Path release_assets
          $version = "${{ steps.get_version.outputs.version }}"
          $msi = Get-ChildItem -Path desktopApp/build -Filter "*.msi" -Recurse | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName -Destination "release_assets/schedule_windows_${version}.msi"
          }
          $exe = Get-ChildItem -Path desktopApp/build -Filter "*.exe" -Recurse | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName -Destination "release_assets/schedule_windows_${version}.exe"
          }

      - name: Upload Windows Installers to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          files: release_assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_macos_and_ios:
    name: Build macOS (DMG) & iOS Targets
    runs-on: macos-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Determine Version
        id: get_version
        run: |
          VERSION="${{ github.event.release.tag_name || github.event.inputs.version || '1.3.2' }}"
          CLEAN_VERSION="${VERSION#v}"
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Build macOS Target (DMG)
        run: |
          ./gradlew :desktopApp:packageReleaseDmg || ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS || true
          mkdir -p release_assets
          find desktopApp/build -name "*.dmg" -exec cp {} release_assets/schedule_macos_${{ steps.get_version.outputs.version }}.dmg \; || true

      - name: Build iOS Framework
        run: |
          ./gradlew :iosApp:linkReleaseFrameworkIosFat || ./gradlew :iosApp:assemble || true
          mkdir -p release_assets
          if [ -d "iosApp/build/fat-framework/release" ]; then
            cd iosApp/build/fat-framework/release
            zip -r ../../../release_assets/schedule_ios_${{ steps.get_version.outputs.version }}.zip .
            cd -
          elif [ -d "iosApp/build/bin" ]; then
            cd iosApp/build/bin
            zip -r ../../release_assets/schedule_ios_${{ steps.get_version.outputs.version }}.zip .
            cd -
          fi

      - name: Upload macOS & iOS Artifacts to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          files: release_assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Build, Release and Publish All Targets

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.1.0)'
        required: false
        default: '1.1.0'

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError"
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  RELEASE_SIGN_KEY_ALIAS: ${{ secrets.RELEASE_SIGN_KEY_ALIAS }}
  RELEASE_SIGN_KEY_PASSWORD: ${{ secrets.RELEASE_SIGN_KEY_PASSWORD }}

jobs:
  build_release_publish:
    name: Build All Targets, Publish Packages & Attach Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Checkout keystore repo
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.KEYSTORE_GIT_REPOSITORY }}
          token: ${{ secrets.KEYSTORE_ACCESS_TOKEN }}
          path: app/keystore

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Determine Version
        id: get_version
        run: |
          VERSION="${{ github.event.release.tag_name || github.event.inputs.version || '1.1.0' }}"
          # Strip leading 'v' if present
          CLEAN_VERSION="${VERSION#v}"
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Run Tests
        run: |
          ./gradlew :libs:schedule:core:jvmTest \
                    :libs:schedule:rksi:jvmTest \
                    :libs:schedule:dgtu:jvmTest \
                    :libs:schedule:iubip:jvmTest \
                    :libs:schedule:rinh:jvmTest \
                    --stacktrace

      - name: Publish API Libraries to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ./gradlew publish -Pversion=${{ steps.get_version.outputs.version }} --no-daemon

      - name: Build Android Targets (APK & AAB)
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace
          mkdir -p release_assets
          cp app/build/outputs/apk/release/*.apk release_assets/schedule_android_${{ steps.get_version.outputs.version }}.apk || true
          cp app/build/outputs/bundle/release/*.aab release_assets/schedule_android_${{ steps.get_version.outputs.version }}.aab || true

      - name: Build Desktop Target
        run: |
          ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS || ./gradlew :desktopApp:jar || true
          mkdir -p release_assets
          # Collect desktop jar or installer
          find desktopApp/build -name "*.jar" -exec cp {} release_assets/schedule_desktop_${{ steps.get_version.outputs.version }}.jar \; || true

      - name: Build Web Target (Wasm)
        run: |
          ./gradlew :wasmApp:wasmJsBrowserDistribution || true
          if [ -d "wasmApp/build/dist/wasmJs/productionExecutable" ]; then
            cd wasmApp/build/dist/wasmJs/productionExecutable
            zip -r ../../../../../release_assets/schedule_web_${{ steps.get_version.outputs.version }}.zip .
            cd -
          fi

      - name: Upload Artifacts to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup GitHub Pages
        if: success()
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: success() && hashFiles('wasmApp/build/dist/wasmJs/productionExecutable/**') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'wasmApp/build/dist/wasmJs/productionExecutable'

      - name: Deploy to GitHub Pages
        if: success() && hashFiles('wasmApp/build/dist/wasmJs/productionExecutable/**') != ''
        id: deployment
        uses: actions/deploy-pages@v4

  build_ios:
    name: Build iOS Target (Framework)
    runs-on: macos-latest
    needs: build_release_publish
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build iOS Framework
        run: |
          VERSION="${{ github.event.release.tag_name || github.event.inputs.version || '1.1.0' }}"
          CLEAN_VERSION="${VERSION#v}"
          ./gradlew :iosApp:linkReleaseFrameworkIosFat || ./gradlew :iosApp:assemble || true
          mkdir -p release_assets
          if [ -d "iosApp/build/fat-framework/release" ]; then
            cd iosApp/build/fat-framework/release
            zip -r ../../../release_assets/schedule_ios_${CLEAN_VERSION}.zip .
            cd -
          elif [ -d "iosApp/build/bin" ]; then
            cd iosApp/build/bin
            zip -r ../../release_assets/schedule_ios_${CLEAN_VERSION}.zip .
            cd -
          fi

      - name: Upload iOS Artifact to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.version }}
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Sync Schedule Data for Web

on:
  release:
    types: [ published ]
  schedule:
    # РКСИ + все остальные ВУЗы утром (07:23 МСК = 04:23 UTC)
    # Используем ненулевые минуты (:23/:43), чтобы избегать пиковой очереди GitHub Actions в :00
    - cron: '23 4 * * *'
    # РКСИ в течение дня (замены): 10:23, 13:23, 16:23, 19:23 МСК
    # Ночью (с 19:30 до 07:00 МСК) запросы ОТКЛЮЧЕНЫ.
    - cron: '23 7,10,13,16 * * *'
    # Остальные ВУЗы вечером: 18:43 МСК (15:43 UTC)
    - cron: '43 15 * * *'

  workflow_dispatch:
    inputs:
      target:
        description: 'Target institution (all, rksi, dgtu, iubip, rinh, sfedu, rgups, rgups_tuapse, others)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - rksi
          - dgtu
          - iubip
          - rinh
          - sfedu
          - rgups
          - rgups_tuapse
          - tvgu
          - others
      filter:
        description: 'Optional group/name filter (e.g. ЮР-33)'
        required: false
        default: ''
        type: string

jobs:
  sync_schedule:
    name: Parse & Sync Schedule Data
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Determine Sync Target
        id: determine_target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.target }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "target=all" >> $GITHUB_OUTPUT
          else
            # Опираемся на точный cron-триггер, а не на текущее время запуска,
            # иначе при задержке очереди GitHub Actions утренний 'all' сбрасывался в 'rksi'.
            case "${{ github.event.schedule }}" in
              "23 4 * * *")
                echo "target=all" >> $GITHUB_OUTPUT
                ;;
              "43 15 * * *")
                echo "target=others" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "target=rksi" >> $GITHUB_OUTPUT
                ;;
            esac
          fi

      - name: Run Schedule Sync CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPR_USER: ${{ github.actor }}
          GPR_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/schedule_out/schedule
          ARGS="--target ${{ steps.determine_target.outputs.target }} --out ${GITHUB_WORKSPACE}/build/schedule_out/schedule"
          if [ -n "${{ github.event.inputs.filter }}" ]; then
            ARGS="$ARGS --filter '${{ github.event.inputs.filter }}'"
          fi
          ./gradlew :tools:schedule-sync:run --args="$ARGS"

      - name: Deploy Schedule to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/schedule_out
          publish_branch: gh-pages
          keep_files: true
          commit_message: "[CI] Update schedule data ($(date -u '+%Y-%m-%d %H:%M UTC'))"

      - name: Trigger Bot Schedule Pusher
        run: |
          curl -s -X POST "https://what-schedule-bot.whatrushki-tech.workers.dev/api/cron/run" \
            -H "User-Agent: GitHub-Actions-Schedule-Sync" || true



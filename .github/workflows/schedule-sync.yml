name: Sync Schedule Data for Web

on:
  release:
    types: [ published ]
  schedule:
    # РКСИ (частые изменения и планшетки замен):
    # 07:00, 10:00, 13:00, 16:00, 19:00 МСК (UTC+3) -> 04:00, 07:00, 10:00, 13:00, 16:00 UTC
    # Ночью (с 19:01 до 06:59 МСК) запросы СТРОГО ОТКЛЮЧЕНЫ.
    - cron: '0 4,7,10,13,16 * * *'
    # Остальные ВУЗы (ДГТУ, ИУБиП, РИНХ, ЮФУ):
    # 07:00 и 18:00 МСК (UTC+3) -> 04:00 и 15:00 UTC
    - cron: '0 4,15 * * *'

  workflow_dispatch:
    inputs:
      target:
        description: 'Target institution (all, rksi, dgtu, iubip, rinh, sfedu, others)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - rksi
          - dgtu
          - iubip
          - rinh
          - sfedu
          - others

jobs:
  sync_schedule:
    name: Parse & Sync Schedule Data
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Determine Sync Target
        id: determine_target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.target }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "target=all" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -eq "04" ]; then
              echo "target=all" >> $GITHUB_OUTPUT
            elif [ "$HOUR" -eq "15" ]; then
              echo "target=others" >> $GITHUB_OUTPUT
            else
              echo "target=all" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run Schedule Sync CLI
        run: |
          mkdir -p .github/schedule
          ./gradlew :tools:schedule-sync:run --args="--target ${{ steps.determine_target.outputs.target }} --out ${GITHUB_WORKSPACE}/.github/schedule"

      - name: Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .github/schedule
          git add -A .github/schedule/
          if git diff --staged --quiet; then
            echo "No schedule changes to commit."
          else
            git commit -m "[CI] Update schedule data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git pull origin master --rebase
            git push origin HEAD:master
          fi

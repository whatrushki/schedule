[versions]
appVersion = "1.3.11"
agp = "8.12.3"
qrose = "1.1.2"
rustoreBom = "2025.08.01"
firebaseBom = "34.10.0"
glanceAppwidget = "1.1.1"
kotlin = "2.3.10"
coreKtx = "1.18.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
ksoupLite = "0.2.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
composeBom = "2026.03.00"

# Proto DataStore
poi = "5.5.1"

# Подгрузка изображений из сети
coil = "3.4.0"

# DI
koin = "4.1.1"
koin-compose = "4.1.1"

# Сеть
ktor = "3.4.1"

processPhoenix = "3.0.0"
room = "2.8.4"

materialKolor = "2.0.2"
kotlinx-serialization = "1.10.0"
navigationCompose = "2.9.7"
appcompatVersion = "1.7.1"
materialVersion = "1.13.0"
uiGeometry = "1.10.5"
material3 = "1.4.0"
workRuntimeKtx = "2.11.1"
kotlinx-datetime = "0.6.2"
okio = "3.10.2"
compose-multiplatform = "1.8.2"

[libraries]
androidx-glance = { module = "androidx.glance:glance", version.ref = "glanceAppwidget" }
androidx-glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glanceAppwidget" }
androidx-glance-material3 = { module = "androidx.glance:glance-material3", version.ref = "glanceAppwidget" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "workRuntimeKtx" }
appupdate = { module = "ru.rustore.sdk:appupdate" }
bom = { module = "ru.rustore.sdk:bom", version.ref = "rustoreBom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
